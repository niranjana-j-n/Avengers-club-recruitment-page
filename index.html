        --bg-card-glass: rgba(17, 21, 29, 0.75);

        --accent-blue-glow: rgba(56, 189, 248, 0.45);
        --accent-blue-subtle: rgba(56, 189, 248, 0.12);

        --text-main: #FFFFFF;
        --text-muted: #A5ADBA;
        --text-dim: #64748B;

        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }

      html {

        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: var(--font-body);
      }

        background-color: var(--bg-main);

        background-attachment: fixed;
        min-height: 100vh;

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #080A0F;
      }
      ::-webkit-scrollbar-thumb {
        background: #1f2736;
        border-radius: 4px;
        border: 1px solid rgba(56, 189, 248, 0.2);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent-red);
      }

      }

      .font-display {
        font-family: var(--font-display);

      }

      .font-tactical {
        font-family: var(--font-tactical);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .text-gradient-hero {
        background: linear-gradient(135deg, #FFFFFF 10%, #E2E8F0 40%, var(--accent-blue) 75%, var(--accent-red) 100%);

        -webkit-text-fill-color: transparent;
      }

      .container-custom {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 1.5rem;
      }

      .bg-grid-pattern {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      }

      .avenger-card {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        position: relative;
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }

      .avenger-card:hover {
        transform: translateY(-4px);
        border-color: var(--border-glow-blue);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.15);

        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border-radius: 9999px;
        font-family: var(--font-tactical);

        border: 1px solid rgba(230, 36, 41, 0.35);
        color: #FFA3A5;
      }

      .badge-blue {

        border: 1px solid rgba(56, 189, 248, 0.35);

        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.85rem 1.85rem;
        background: linear-gradient(135deg, #E62429 0%, #B91C1C 100%);
        color: #FFFFFF;
        font-family: var(--font-display);
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        border-radius: 8px;
        border: 1px solid rgba(255, 120, 120, 0.3);
        cursor: pointer;
        transition: all 0.25s ease;
        position: relative;
        overflow: hidden;
        text-decoration: none;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, #FF2B30 0%, #DC2626 100%);
        box-shadow: 0 0 25px rgba(230, 36, 41, 0.5);
        transform: translateY(-2px);

        display: inline-flex;

        gap: 0.6rem;
        padding: 0.85rem 1.85rem;
        background: rgba(17, 21, 29, 0.85);

        font-family: var(--font-display);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        border-radius: 8px;
        border: 1px solid rgba(56, 189, 248, 0.35);
        cursor: pointer;
        transition: all 0.25s ease;
        text-decoration: none;
      }

        background: rgba(56, 189, 248, 0.1);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
        transform: translateY(-2px);

        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; filter: drop-shadow(0 0 12px #E62429); }
      }

      .animate-beacon {
        animation: redBeacon 2s infinite ease-in-out;
      }

      .corner-accent {
        position: relative;
      }
      .corner-accent::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 12px;
        height: 12px;
        border-top: 2px solid var(--accent-blue);
        border-left: 2px solid var(--accent-blue);
        pointer-events: none;
      }
      .corner-accent::after {
        content: '';
        position: absolute;
        bottom: 0;
        right: 0;
        width: 12px;
        height: 12px;
        border-bottom: 2px solid var(--accent-blue);
        border-right: 2px solid var(--accent-blue);
        pointer-events: none;
      }

          font-size: 0.8rem;

              <div className="container-custom">
                <div style={{ textAlign: 'center', maxWidth: '800px', margin: '0 auto 3.5rem auto' }}>
                  <div className="badge-tag badge-red" style={{ marginBottom: '1rem' }}>
                    <Icon name="shield" size={12} color="#FFA3A5" />
                    <span>CONFIDENTIAL DOSSIER TRANSMISSION</span>
                  </div>
                  <h2 className="font-display" style={{ fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 800, marginBottom: '1rem' }}>
                    ENLISTMENT APPLICATION
                  </h2>
                  <p style={{ color: '#A5ADBA', lineHeight: 1.7, fontSize: '1.05rem' }}>
                    Fill out the tactical form below to apply for the 2026 intake.
                  </p>
                </div>

                {submittedAgent ? (
                  /* Confirmed Card */
                  <div style={{
                    maxWidth: '680px',
                    margin: '0 auto',
                    textAlign: 'center',
                    padding: '2.5rem 1.5rem',
                    background: 'linear-gradient(145deg, #121724 0%, #0B0E15 100%)',
                    border: '2px solid #38BDF8',
                    borderRadius: '24px',
                    boxShadow: '0 25px 60px rgba(0, 0, 0, 0.9), 0 0 30px rgba(56, 189, 248, 0.25)'
                  }} className="corner-accent">
                    <div style={{ width: '64px', height: '64px', borderRadius: '50%', background: 'rgba(16, 185, 129, 0.15)', border: '2px solid #10B981', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 1.5rem auto' }}>
                      <Icon name="checkcircle" size={32} color="#10B981" />
                    </div>
                    <div className="font-tactical" style={{ color: '#10B981', fontSize: '0.9rem', fontWeight: 700, marginBottom: '0.5rem' }}>
                      DOSSIER ENCRYPTED & TRANSMITTED
                    </div>
                    <h3 className="font-display" style={{ fontSize: '1.85rem', fontWeight: 800, color: '#FFFFFF', marginBottom: '1rem' }}>
                      Welcome, Cadet {submittedAgent.fullName.split(' ')[0]}!
                    </h3>
                    <p style={{ color: '#A5ADBA', fontSize: '0.95rem', maxWidth: '520px', margin: '0 auto 2rem auto', lineHeight: 1.6 }}>
                      Your recruitment application has been officially logged in our mainframe. Keep your assigned Protocol ID safe for clearance verification.
                    </p>

                    {/* ID Card Graphic */}
                    <div style={{ background: '#151B27', border: '1px solid #38BDF8', borderRadius: '16px', padding: '1.75rem', textAlign: 'left', marginBottom: '2rem' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid rgba(255, 255, 255, 0.1)', paddingBottom: '0.75rem', marginBottom: '1.25rem' }}>
                        <span className="font-display" style={{ fontSize: '0.9rem', fontWeight: 800, color: '#FFFFFF' }}>AVENGERS S.H.I.E.L.D. CREDENTIAL</span>
                        <span className="font-tactical" style={{ color: '#38BDF8', fontSize: '0.8rem', fontWeight: 700 }}>CADET CLEARANCE</span>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '1rem' }}>
                        <div>
                          <div style={{ color: '#64748B', fontSize: '0.7rem' }}>OPERATIVE NAME</div>
                          <div style={{ fontSize: '1.1rem', fontWeight: 700, color: '#FFFFFF' }}>{submittedAgent.fullName}</div>
                        </div>
                        <div>
                          <div style={{ color: '#64748B', fontSize: '0.7rem' }}>AGENT PROTOCOL ID</div>
                          <div className="font-display" style={{ fontSize: '1.1rem', fontWeight: 800, color: '#38BDF8' }}>{submittedAgent.id}</div>
                        </div>
                        <div>
                          <div style={{ color: '#64748B', fontSize: '0.7rem' }}>ASSIGNED WING</div>
                          <div style={{ fontSize: '0.9rem', fontWeight: 600, color: '#FFA3A5' }}>{selectedSec.name}</div>
                        </div>
                        <div>
                          <div style={{ color: '#64748B', fontSize: '0.7rem' }}>STATUS</div>
                          <div style={{ fontSize: '0.85rem', fontWeight: 600, color: '#10B981' }}>● Active Review</div>
                        </div>
                      </div>
                    </div>

                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '1rem', justifyContent: 'center' }}>
                      <button onClick={() => window.print()} className="btn-secondary">
                        <Icon name="download" size={16} />
                        <span>Print Dossier Card</span>
                      </button>
                      <button onClick={() => { setSubmittedAgent(null); setFormStep(1); }} className="btn-primary">
                        <span>Submit Another Application</span>
                      </button>
                    </div>
                  </div>
                ) : (
                  /* Form */
                  <div style={{ maxWidth: '860px', margin: '0 auto', background: '#121622', border: '1px solid rgba(56, 189, 248, 0.3)', borderRadius: '20px', padding: 'clamp(1.5rem, 4vw, 3rem)' }} className="corner-accent">
                    
                    {/* Stepper */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '2.5rem' }}>
                      {[
                        { s: 1, l: "Cadet Profile" },
                        { s: 2, l: "Wing & Skills" },
                        { s: 3, l: "Tactical Scenario" }
                      ].map(item => (
                        <div key={item.s} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', opacity: item.s <= formStep ? 1 : 0.4 }}>
                          <div style={{ width: '32px', height: '32px', borderRadius: '50%', background: item.s === formStep ? '#E62429' : item.s < formStep ? '#10B981' : 'rgba(255, 255, 255, 0.1)', color: '#FFFFFF', fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '0.85rem' }}>
                            {item.s < formStep ? '✓' : item.s}
                          </div>
                          <span className="font-tactical hidden-mobile" style={{ fontSize: '0.85rem', color: '#FFFFFF', fontWeight: 600 }}>{item.l}</span>
                        </div>
                      ))}
                    </div>

                    <form onSubmit={handleFormSubmit}>
                      {formStep === 1 && (
                        <div>
                          <h3 className="font-display" style={{ fontSize: '1.35rem', fontWeight: 700, color: '#FFFFFF', marginBottom: '1.5rem' }}>Step 1: Cadet Information</h3>
                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '1.25rem' }}>
                            <div>
                              <label style={{ display: 'block', color: '#E2E8F0', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.4rem' }}>Agent Full Name *</label>
                              <input type="text" name="fullName" value={formData.fullName} onChange={handleFormChange} placeholder="e.g. Peter Parker" style={{ width: '100%', background: 'rgba(255, 255, 255, 0.04)', border: formErrors.fullName ? '1px solid #E62429' : '1px solid rgba(255, 255, 255, 0.15)', borderRadius: '8px', padding: '0.85rem 1rem', color: '#FFFFFF', outline: 'none' }} />
                              {formErrors.fullName && <p style={{ color: '#FFA3A5', fontSize: '0.75rem', marginTop: '0.25rem' }}>{formErrors.fullName}</p>}
                            </div>

                            <div>
                              <label style={{ display: 'block', color: '#E2E8F0', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.4rem' }}>Student Roll No / ID *</label>
                              <input type="text" name="studentId" value={formData.studentId} onChange={handleFormChange} placeholder="e.g. 24CS1092" style={{ width: '100%', background: 'rgba(255, 255, 255, 0.04)', border: formErrors.studentId ? '1px solid #E62429' : '1px solid rgba(255, 255, 255, 0.15)', borderRadius: '8px', padding: '0.85rem 1rem', color: '#FFFFFF', outline: 'none' }} />
                              {formErrors.studentId && <p style={{ color: '#FFA3A5', fontSize: '0.75rem', marginTop: '0.25rem' }}>{formErrors.studentId}</p>}
                            </div>

                            <div>
                              <label style={{ display: 'block', color: '#E2E8F0', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.4rem' }}>Email Address *</label>
                              <input type="email" name="email" value={formData.email} onChange={handleFormChange} placeholder="cadet@university.edu" style={{ width: '100%', background: 'rgba(255, 255, 255, 0.04)', border: formErrors.email ? '1px solid #E62429' : '1px solid rgba(255, 255, 255, 0.15)', borderRadius: '8px', padding: '0.85rem 1rem', color: '#FFFFFF', outline: 'none' }} />
                              {formErrors.email && <p style={{ color: '#FFA3A5', fontSize: '0.75rem', marginTop: '0.25rem' }}>{formErrors.email}</p>}
                            </div>

                            <div>
                              <label style={{ display: 'block', color: '#E2E8F0', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.4rem' }}>Year of Study</label>
                              <select name="year" value={formData.year} onChange={handleFormChange} style={{ width: '100%', background: '#161B26', border: '1px solid rgba(255, 255, 255, 0.15)', borderRadius: '8px', padding: '0.85rem 1rem', color: '#FFFFFF', outline: 'none' }}>
                                <option>1st Year Undergraduate</option>
                                <option>2nd Year Undergraduate</option>
                                <option>3rd Year Undergraduate</option>
                                <option>4th Year Undergraduate</option>
                                <option>Postgraduate / Masters</option>
                              </select>
                            </div>
                          </div>
                        </div>
                      )}

                      {formStep === 2 && (
                        <div>
                          <h3 className="font-display" style={{ fontSize: '1.35rem', fontWeight: 700, color: '#FFFFFF', marginBottom: '1.5rem' }}>Step 2: Squadron & Superpowers</h3>
                          <div style={{ marginBottom: '1.5rem' }}>
                            <label style={{ display: 'block', color: '#E2E8F0', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.6rem' }}>Primary Squadron Preference</label>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '0.75rem' }}>
                              {sectorsData.map(sec => (
                                <div
                                  key={sec.id}
                                  onClick={() => setFormData(p => ({ ...p, primarySector: sec.id }))}
                                  style={{
                                    padding: '0.85rem',
                                    borderRadius: '8px',
                                    background: formData.primarySector === sec.id ? 'rgba(56, 189, 248, 0.15)' : 'rgba(255, 255, 255, 0.03)',
                                    border: formData.primarySector === sec.id ? `2px solid ${sec.color}` : '1px solid rgba(255, 255, 255, 0.1)',
                                    cursor: 'pointer'
                                  }}
                                >
                                  <div style={{ fontSize: '0.85rem', fontWeight: 700, color: '#FFFFFF' }}>{sec.name}</div>
                                  <div style={{ fontSize: '0.75rem', color: sec.color }}>{sec.heroArchetype}</div>
                                </div>
                              ))}
                            </div>
                          </div>

                          <div>
                            <label style={{ display: 'block', color: '#E2E8F0', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.4rem' }}>Skills & Superpowers *</label>
                            <input type="text" name="skills" value={formData.skills} onChange={handleFormChange} placeholder="e.g. Python, React, ROS2, Figma, Stage Management..." style={{ width: '100%', background: 'rgba(255, 255, 255, 0.04)', border: formErrors.skills ? '1px solid #E62429' : '1px solid rgba(255, 255, 255, 0.15)', borderRadius: '8px', padding: '0.85rem 1rem', color: '#FFFFFF', outline: 'none' }} />
                            {formErrors.skills && <p style={{ color: '#FFA3A5', fontSize: '0.75rem', marginTop: '0.25rem' }}>{formErrors.skills}</p>}
                          </div>
                        </div>
                      )}

                      {formStep === 3 && (
                        <div>
                          <h3 className="font-display" style={{ fontSize: '1.35rem', fontWeight: 700, color: '#FFFFFF', marginBottom: '1.5rem' }}>Step 3: Tactical Scenario Assessment</h3>
                          <div style={{ background: 'rgba(230, 36, 41, 0.1)', border: '1px solid rgba(230, 36, 41, 0.3)', borderRadius: '8px', padding: '1rem', marginBottom: '0.75rem' }}>
                            <p style={{ color: '#FFFFFF', fontSize: '0.9rem', fontWeight: 600 }}>
                              "Thanos just snapped half of your project's codebase or stage equipment 90 minutes before showtime. What is your playbook?"
                            </p>
                          </div>
                          <textarea name="tacticalScenario" value={formData.tacticalScenario} onChange={handleFormChange} rows={4} placeholder="Walk us through your composure, rollback strategy, or quick problem-solving..." style={{ width: '100%', background: 'rgba(255, 255, 255, 0.04)', border: formErrors.tacticalScenario ? '1px solid #E62429' : '1px solid rgba(255, 255, 255, 0.15)', borderRadius: '8px', padding: '0.85rem 1rem', color: '#FFFFFF', outline: 'none', resize: 'vertical' }} />
                          {formErrors.tacticalScenario && <p style={{ color: '#FFA3A5', fontSize: '0.75rem', marginTop: '0.25rem' }}>{formErrors.tacticalScenario}</p>}
                        </div>
                      )}

                      {/* Controls */}
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '2.5rem', paddingTop: '1.5rem', borderTop: '1px solid rgba(255, 255, 255, 0.08)' }}>
                        {formStep > 1 ? (
                          <button type="button" onClick={() => setFormStep(p => p - 1)} className="btn-secondary">
                            ← Back
                          </button>
                        ) : <div />}

                        {formStep < 3 ? (
                          <button type="button" onClick={() => { if (validateFormStep(formStep)) setFormStep(p => p + 1); }} className="btn-primary">
                            Next Protocol →
                          </button>
                        ) : (
                          <button type="submit" disabled={isSubmitting} className="btn-primary">
                            <Icon name="shield" size={16} />
                            <span>{isSubmitting ? "Encrypting & Logging..." : "Transmit Application"}</span>
                          </button>
                        )}
                      </div>
                    </form>
                  </div>
                )}

              </div>
            </section>

            {/* --- FAQ ACCORDION --- */}
            <section id="faq" style={{ padding: '6rem 0', position: 'relative' }}>
              <div className="container-custom">
                <div style={{ textAlign: 'center', maxWidth: '800px', margin: '0 auto 4rem auto' }}>
                  <div className="badge-tag badge-red" style={{ marginBottom: '1rem' }}>
                    <Icon name="search" size={12} color="#FFA3A5" />
                    <span>INTEL & GUIDANCE</span>
                  </div>
                  <h2 className="font-display" style={{ fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 800, marginBottom: '1rem' }}>
                    FREQUENTLY ASKED QUESTIONS
                  </h2>
                </div>

                <div style={{ maxWidth: '820px', margin: '0 auto', display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  {faqData.map((f, i) => (
                    <div key={i} className="avenger-card" style={{ borderRadius: '12px', border: openFaq === i ? '1px solid #38BDF8' : '1px solid rgba(255, 255, 255, 0.08)' }}>
                      <button onClick={() => setOpenFaq(openFaq === i ? null : i)} style={{ width: '100%', padding: '1.25rem 1.5rem', background: 'transparent', border: 'none', color: '#FFFFFF', textAlign: 'left', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <span className="font-display" style={{ fontSize: '1rem', fontWeight: 700, color: openFaq === i ? '#38BDF8' : '#FFFFFF' }}>{f.q}</span>
                        <Icon name={openFaq === i ? "chevronup" : "chevrondown"} size={18} />
                      </button>
                      {openFaq === i && (
                        <div style={{ padding: '0 1.5rem 1.25rem 1.5rem', color: '#A5ADBA', fontSize: '0.9rem', lineHeight: 1.6 }}>
                          {f.a}
                        </div>
                      )}
                    </div>
                  ))}
                </div>

              </div>
            </section>

            {/* --- FOOTER --- */}
            <footer style={{ borderTop: '1px solid rgba(255, 255, 255, 0.08)', background: '#06070B', padding: '4rem 0 2rem 0' }}>
              <div className="container-custom">
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '2.5rem', marginBottom: '3rem' }}>
                  <div>
                    <span className="font-display" style={{ fontWeight: 800, fontSize: '1.2rem', color: '#FFFFFF' }}>
                      AVENGERS<span style={{ color: '#E62429' }}>CLUB</span>
                    </span>
                    <p style={{ color: '#A5ADBA', fontSize: '0.85rem', lineHeight: 1.6, marginTop: '0.75rem' }}>
                      Earth's mightiest collegiate innovation syndicate. Building the future of engineering, art, and leadership on campus.
                    </p>
                  </div>
                  <div>
                    <div className="font-tactical" style={{ color: '#FFFFFF', fontSize: '0.85rem', fontWeight: 700, marginBottom: '0.75rem' }}>CAMPUS HQ</div>
                    <p style={{ color: '#94A3B8', fontSize: '0.85rem', lineHeight: 1.5 }}>
                      Stark Innovation Hub, Level 3 <br />
                      Makerspace & Engineering Complex <br />
                      Comms: avengers@university.edu
                    </p>
                  </div>
                </div>
                <div style={{ borderTop: '1px solid rgba(255, 255, 255, 0.06)', paddingTop: '1.5rem', display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: '1rem', fontSize: '0.75rem', color: '#64748B' }}>
                  <div>© 2026 AVENGERS CLUB. Student Organization Initiative.</div>
                  <div>Clearance: LEVEL 7 • Earth-616 Syndicate</div>
                </div>
              </div>
            </footer>

            {/* --- CLEARANCE STATUS MODAL --- */}
            {isStatusModalOpen && (
              <div style={{ position: 'fixed', inset: 0, background: 'rgba(0, 0, 0, 0.85)', backdropFilter: 'blur(12px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 110, padding: '1.5rem' }}>
                <div style={{ background: '#11151D', border: '1px solid #38BDF8', borderRadius: '20px', maxWidth: '600px', width: '100%', padding: '2rem', position: 'relative' }} className="corner-accent">
                  <button onClick={() => setIsStatusModalOpen(false)} style={{ position: 'absolute', top: '1.25rem', right: '1.25rem', background: 'rgba(255, 255, 255, 0.1)', border: 'none', color: '#FFFFFF', borderRadius: '50%', width: '32px', height: '32px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
                    <Icon name="x" size={16} />
                  </button>
                  <div className="font-tactical" style={{ color: '#38BDF8', fontSize: '0.8rem', fontWeight: 700, marginBottom: '0.3rem' }}>S.H.I.E.L.D. CENTRAL CLEARANCE TERMINAL</div>
                  <h3 className="font-display" style={{ fontSize: '1.5rem', fontWeight: 800, color: '#FFFFFF', marginBottom: '1rem' }}>Verify Application Status</h3>
                  
                  {/* Demo preview pills */}
                  <div style={{ marginBottom: '1.25rem' }}>
                    <div style={{ fontSize: '0.75rem', color: '#64748B', marginBottom: '0.4rem' }}>ACTIVE SAMPLE CADETS IN SYSTEM:</div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.4rem' }}>
                      {[
                        { id: "AVG-2026-9042", name: "Peter Parker", status: "STAGE 2 CLEARED", color: "#10B981" },
                        { id: "AVG-2026-1108", name: "Miles Morales", status: "UNDER REVIEW", color: "#F59E0B" },
                        { id: "AVG-2026-3391", name: "Gwen Stacy", status: "THE GAUNTLET PASSED", color: "#38BDF8" }
                      ].map(s => (
                        <div key={s.id} style={{ background: 'rgba(255, 255, 255, 0.04)', border: '1px solid rgba(255, 255, 255, 0.1)', padding: '0.4rem 0.6rem', borderRadius: '6px', fontSize: '0.75rem' }}>
                          <span style={{ color: '#38BDF8', fontWeight: 700 }}>{s.id}</span>: <span style={{ color: '#FFFFFF' }}>{s.name}</span> (<span style={{ color: s.color }}>{s.status}</span>)
                        </div>
                      ))}
                    </div>
                  </div>

                  {userSubmittedAgents.length > 0 && (
                    <div style={{ marginTop: '1rem', background: '#161E2E', border: '1px solid #10B981', padding: '1rem', borderRadius: '8px' }}>
                      <div style={{ fontSize: '0.8rem', color: '#10B981', fontWeight: 700 }}>YOUR RECENTLY SUBMITTED DOSSIER:</div>
                      <div style={{ fontSize: '0.95rem', fontWeight: 700, color: '#FFFFFF', marginTop: '0.2rem' }}>
                        {userSubmittedAgents[0].id} — {userSubmittedAgents[0].fullName}
                      </div>
                      <div style={{ fontSize: '0.8rem', color: '#A5ADBA' }}>
                        Assigned Wing: {userSubmittedAgents[0].primarySector} • Status: Under Review
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Tactical Toast Alert */}
            {toastMessage && (
              <div style={{ position: 'fixed', bottom: '24px', right: '24px', background: '#11151D', border: '1px solid #38BDF8', borderRadius: '10px', padding: '0.85rem 1.25rem', color: '#FFFFFF', fontSize: '0.85rem', fontWeight: 600, display: 'flex', alignItems: 'center', gap: '0.6rem', zIndex: 999, boxShadow: '0 10px 30px rgba(0,0,0,0.8)' }}>
                <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: '#38BDF8' }} />
                <span>{toastMessage}</span>
              </div>
            )}

          </div>
        );
      }

      // Mount Application
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
